#
# 测试专用 ShardingSphere 配置：使用 H2 内存库模拟 ds0/ds1 两个分库，
# 分片规则与生产 sharding.yaml 完全一致，用于在无 MySQL/Docker 环境验证路由逻辑。
#
databaseName: order_db

mode:
  type: Standalone
  repository:
    type: JDBC

dataSources:
  ds0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.h2.Driver
    jdbcUrl: 'jdbc:h2:mem:ds0;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM ''classpath:h2/schema-ds0.sql'''
    username: sa
    password: ''
    maximumPoolSize: 5
    minimumIdle: 2
    poolName: test-ds0
  ds1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.h2.Driver
    jdbcUrl: 'jdbc:h2:mem:ds1;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM ''classpath:h2/schema-ds1.sql'''
    username: sa
    password: ''
    maximumPoolSize: 5
    minimumIdle: 2
    poolName: test-ds1

rules:
  - !SHARDING
    tables:
      t_order:
        actualDataNodes: ds${0..1}.t_order_${0..3}
        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: t-order-db-mod
        tableStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: t-order-table-mod
        keyGenerateStrategy:
          column: order_id
          keyGeneratorName: snowflake
    shardingAlgorithms:
      t-order-db-mod:
        type: MOD
        props:
          sharding-count: 2
      t-order-table-mod:
        type: MOD
        props:
          sharding-count: 4
    keyGenerators:
      snowflake:
        type: SNOWFLAKE
  - !SINGLE
    tables:
      - 'ds0.t_config'

props:
  sql-show: true
