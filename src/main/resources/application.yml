spring:
  application:
    name: sharding-demo
  datasource:
    # ShardingSphere JDBC 驱动（官方推荐接入方式）
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # 官方支持的 URL 类型只有两种：
    #   classpath:    从包内 classpath 加载（本地开发/单环境）
    #   absolutepath: 从文件系统绝对路径加载（生产：挂载外部配置文件后，
    #                 用环境变量覆盖为 jdbc:shardingsphere:absolutepath:/etc/ss/sharding.yaml）
    url: jdbc:shardingsphere:classpath:sharding.yaml
    # 外层 Hikari 管理逻辑连接，真实库连接池在 sharding.yaml 的 dataSources 内配置
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  config: classpath:logback-spring.xml
