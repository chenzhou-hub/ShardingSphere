services:
  mysql-ds0:
    image: mysql:8.0
    container_name: mysql-ds0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: order_db_0
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./sql/order_db_0.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-ds1:
    image: mysql:8.0
    container_name: mysql-ds1
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: order_db_1
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - ./sql/order_db_1.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20
